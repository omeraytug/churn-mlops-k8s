name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  schedule:
    - cron: "0 6 * * 1"
      timezone: "Europe/Stockholm"

  workflow_dispatch:
    inputs:
      csv_file:
        description: "Välj CSV-fil att validera"
        required: true
        type: choice
        default: "kundbas.csv"
        options:
          - "kundbas.csv"
          - "kundbas_ny_leverans.csv"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  attestations: read

jobs:
  datakontroll:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-project
        with:
          python-version: "3.11"
      - name: Validate customer data
        env:
          CSV_FILE: ${{ inputs.csv_file || 'kundbas.csv' }}
        run: python -m kontroller.validera "data/$CSV_FILE"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-project
        with:
          python-version: ${{ matrix.python-version }}
          install-dev: "true"

      - name: Run unit tests
        run: python -m pytest --ignore=tests/test_api.py

  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-project
        with:
          python-version: "3.11"

      - name: List installed runtime dependencies
        run: pip freeze --exclude-editable > installed.txt

      - name: Scan dependencies for known vulnerabilities
        id: audit
        run: |
          pipx run --spec pip-audit==2.9.0 pip-audit \
            --requirement installed.txt \
            --no-deps \
            --disable-pip \
            --aliases \
            --progress-spinner off \
            --format markdown \
            --output audit.md

      - name: Write scan summary
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          {
            echo "## Dependency scan"
            echo
            echo "Scanned $(wc -l < installed.txt) installed packages."
            echo
            if [[ "$AUDIT_OUTCOME" == "success" ]]; then
              echo "No known vulnerabilities found."
            elif [[ -s audit.md ]]; then
              cat audit.md
            else
              echo "The scan could not be completed, see the log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  train:
    needs: [test, datakontroll, dependency-scan]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-project
        with:
          python-version: "3.11"

      - run: python -m churn.model

      - name: Attest model provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            outputs/modell.joblib
            outputs/matvarden.json

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/
          if-no-files-found: error

  evaluate:
    needs: train
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-project
        with:
          python-version: "3.11"
          install-dev: "true"

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - uses: ./.github/actions/verify-model

      - name: Test FastAPI
        run: pytest tests/test_api.py -v

      - name: Write model summary
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          metrics = json.loads(
              Path("outputs/matvarden.json").read_text()
          )

          print("## Modellutvärdering")
          print()
          print("| Mätvärde | Värde |")
          print("|---|---|")
          print(f"| ROC AUC | {metrics['roc_auc']:.4f} |")
          print(f"| Accuracy | {metrics['accuracy']:.4f} |")
          print(f"| Commit | `{metrics['commit']}` |")
          print(f"| Run ID | `{metrics['run_id']}` |")
          print(f"| Data SHA256 | `{metrics['data_sha256']}` |")
          print(f"| Model SHA256 | `{metrics['model_sha256']}` |")
          PY

      - name: Evaluate model
        run: python -m churn.evaluate

      - name: Check model regression against champion
        run: python -m churn.regression_gate

  docker-smoke:
    needs: evaluate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - uses: ./.github/actions/verify-model

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: churn-score:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=churn-score
          cache-to: type=gha,mode=max,scope=churn-score

      - name: Run scoring inside container
        run: |
          docker run --name smoke \
            -e ANTAL=5 \
            churn-score:${{ github.sha }}

      - name: Check ringlista
        run: |
          docker cp smoke:/app/outputs/ringlista.csv ringlista.csv

          python3 - <<'PY'
          import csv
          from pathlib import Path

          with Path("ringlista.csv").open(newline="") as file:
              rows = list(csv.DictReader(file))

          assert len(rows) == 5, f"Expected 5 rows, got {len(rows)}"
          assert all(
              0 <= float(row["risk"]) <= 1
              for row in rows
          ), "Risk outside [0, 1]"

          print(f"OK: {len(rows)} customers scored")
          PY

      - name: Save Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker save churn-score:${{ github.sha }} -o image.tar

      - name: Upload Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ github.sha }}
          path: image.tar
          if-no-files-found: error

      - name: Remove smoke test container
        if: always()
        run: docker rm -f smoke 2>/dev/null || true

  docker-api-smoke:
    needs: evaluate
    # The course cluster runs arm64, so build and test the image on the same architecture.
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - name: Download model artifact
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - uses: ./.github/actions/verify-model

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.API
          push: false
          load: true
          tags: churn-api:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=churn-api
          cache-to: type=gha,mode=max,scope=churn-api

      - name: Start API container
        run: docker run -d --name api-smoke -p 8000:8000 churn-api:${{ github.sha }}

      - name: Wait for API health
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api-smoke
          exit 1

      - name: Check model version
        run: curl -fsS http://localhost:8000/version | grep -qF "\"commit\":\"$GITHUB_SHA\""

      - name: Check prediction
        run: |
          curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"alder": 42, "manader_som_kund": 18, "manadskostnad": 399, "data_gb_per_manad": 25, "supportarenden_12m": 3, "region": "Stockholm", "abonnemang": "Bas"}' \
            -o prediction.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          risk = json.loads(Path("prediction.json").read_text())["churn_risk"]
          assert 0 <= risk <= 1, f"Risk outside [0, 1]: {risk}"

          print(f"OK: churn_risk={risk}")
          PY
      - name: Save Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: docker save churn-api:${{ github.sha }} -o api-image.tar

      - name: Upload Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: docker-api-image-${{ github.sha }}
          path: api-image.tar
          if-no-files-found: error

      - name: Remove API container
        if: always()
        run: docker rm -f api-smoke 2>/dev/null || true

  publish:
    needs: docker-smoke
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image-${{ github.sha }}

      - name: Load Docker image
        run: docker load -i image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker tag churn-score:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"

  publish-api:
    needs: docker-api-smoke
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-api-image-${{ github.sha }}

      - name: Load Docker image
        run: docker load -i api-image.tar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-api:${GITHUB_SHA}"
          docker tag churn-api:${{ github.sha }} "$IMAGE"
          docker push "$IMAGE"

  deploy-production:
    needs: [publish, publish-api]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # The environment requires approval, and its secrets are only readable after approval.
    environment:
      name: production
      url: http://omer-aytug.89-167-53-206.sslip.io/version

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.5

      - name: Configure cluster access
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBE_CONFIG" > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"
          echo "KUBECONFIG=$KUBECONFIG" >> "$GITHUB_ENV"

      - name: Apply manifests
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-api:${GITHUB_SHA}"
          kubectl set image -f k8s/deployment.yaml "api=$IMAGE" --local -o yaml \
            > "$RUNNER_TEMP/deployment.yaml"

          # A rejected manifest stops here, before anything in the cluster has changed.
          kubectl apply --dry-run=server \
            -f "$RUNNER_TEMP/deployment.yaml" -f k8s/service.yaml -f k8s/cloud/ingress.yaml
          kubectl apply \
            -f "$RUNNER_TEMP/deployment.yaml" -f k8s/service.yaml -f k8s/cloud/ingress.yaml

      - name: Wait for rollout
        id: rollout
        run: kubectl rollout status deployment/churn-api --timeout=180s

      - name: Verify running version through Ingress
        id: verify
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -m 5 http://omer-aytug.89-167-53-206.sslip.io/version \
              | grep -qF "\"commit\":\"$GITHUB_SHA\""; then
              echo "OK: the service runs the model from $GITHUB_SHA"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: the service does not run the model from $GITHUB_SHA"
          exit 1

      # Only after a change has reached the cluster. Undoing after a failed apply would
      # roll a healthy service back to an even older version.
      - name: Roll back failed deployment
        if: failure() && (steps.rollout.outcome == 'failure' || steps.verify.outcome == 'failure')
        run: |
          kubectl rollout undo deployment/churn-api
          kubectl rollout status deployment/churn-api --timeout=180s

      - name: Show deployed state
        if: always() && steps.rollout.outcome != 'skipped'
        run: |
          kubectl get deployment,pods,service,ingress -l app=churn-api
          kubectl rollout history deployment/churn-api

  ringlista:
    needs: evaluate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-project
        with:
          python-version: "3.11"

      - name: Download approved model
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: outputs/

      - uses: ./.github/actions/verify-model

      - name: Generate ringlista
        run: python -m churn.score

      - name: Upload ringlista
        uses: actions/upload-artifact@v4
        with:
          name: ringlista-${{ github.sha }}
          path: outputs/ringlista.csv
          if-no-files-found: error
