apiVersion: v1
kind: ResourceQuota
metadata:
  name: student-quota
spec:
  hard:
    pods: "20"
    requests.cpu: 250m
    requests.memory: 384Mi
    limits.cpu: "2"
    limits.memory: 2Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: student-defaults
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1Gi
